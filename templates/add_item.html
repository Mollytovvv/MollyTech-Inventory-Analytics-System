<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Item</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_item.css') }}">
</head>

<body>

    <form method="POST">

    <h2>Add New Item</h2>

    <form method="POST">
        <label>Item Name</label>
        <input type="text" name="name" required>

        <label>Category</label>
        <input type="text" name="category" required>

        <label>Brand</label>
        <input type="text" name="brand" placeholder="Brand" required>

        <label>Buy Price</label>
        <input type="number" step="0.01" name="buy_price" required>

        <label>Sell Price</label>
        <input type="number" step="0.01" name="sell_price">

        <button type="submit">Save Item</button>
    </form>

    <br>

    <!-- FIXED LINK (IMPORTANT) -->
    <a href="/">
        <button type="button" class="back-btn">Back to Dashboard</button>
    </a>

</body>
</html>
